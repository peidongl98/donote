<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0A0E14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
    <meta name="description" content="多端 Markdown 笔记工具" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0E14'/%3E%3Cpath d='M10 8h9a3 3 0 0 1 3 3v13H13a3 3 0 0 1-3-3V8Z' fill='none' stroke='%235BA88C' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M14 13h4M14 17h4' stroke='%235BA88C' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>笔记</title>
    <!--
      首屏防闪白：必须在样式表加载前同步执行。
      1) data-theme  —— 用户手动覆盖优先，否则跟随系统
      2) data-lite   —— 低端设备降级标记，用于关闭毛玻璃与复杂动效
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('noteapp.theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        var cores = navigator.hardwareConcurrency || 8;
        var memory = navigator.deviceMemory || 8;
        if (cores <= 4 || memory <= 4) {
          document.documentElement.setAttribute('data-lite', '1');
        }
      })();
    </script>
    <style>
      /* 首屏底色也内联，避免样式表到达前出现白闪 */
      html {
        background: #0a0e14;
      }
      html[data-theme='light'] {
        background: #f5f5f7;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
