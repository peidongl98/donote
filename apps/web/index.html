<!doctype html>
<html lang="zh-CN">
  <head>
    <!--
      兜底：注销遗留的 Service Worker。
      背景：0.2.0 及更早的桌面端会注册 SW，把 WebView2 的 profile 缓存住。
      升级到新版时，旧 SW 用旧的 precache 清单回退导航请求，新资源一次都不会被请求，
      界面就停在上一版。下面这段在首屏最前面同步跑掉，清完再 reload 一次，把机器拉回正轨。
      注意：新版桌面端已不再注册 SW（见 vite.config.ts 的 VitePWA.disable），
      这段只为已经被旧 SW 污染的机器准备，正常情况下执行一次就再无 SW 可注销。
    -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;
        // unregister 失败时若不设防，每次启动都会 reload，变成死循环。同一个标签页只做一次。
        try {
          if (sessionStorage.getItem('donote.sw-purged')) return;
          sessionStorage.setItem('donote.sw-purged', '1');
        } catch (e) {
          /* 隐私模式下 sessionStorage 可能不可用，退回不做标记（有 SW 才会 reload，风险有限） */
        }
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;
          Promise.all(
            regs.map(function (r) {
              return r.unregister();
            }),
          ).then(function () {
            if (!('caches' in window)) return;
            caches.keys().then(function (keys) {
              return Promise.all(
                keys.map(function (k) {
                  return caches.delete(k);
                }),
              );
            }).then(function () {
              location.reload();
            });
          });
        });
      })();
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0B1020" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8F9FC" media="(prefers-color-scheme: light)" />
    <meta name="description" content="DoNote —— 多端 Markdown 笔记工具" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B1020'/%3E%3Cpath d='M10 8h9a3 3 0 0 1 3 3v13H13a3 3 0 0 1-3-3V8Z' fill='none' stroke='%234A6FA5' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M14 13h4M14 17h4' stroke='%234A6FA5' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>DoNote</title>
    <!--
      首屏防闪白：必须在样式表加载前同步执行。
      1) data-theme    —— 用户手动覆盖优先，否则跟随系统
      2) data-sidebar  —— 侧边栏初始状态，避免桌面端首帧从「展开」跳到「折叠」
      3) data-lite     —— 低端设备降级标记，用于关闭毛玻璃与复杂动效
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var stored = localStorage.getItem('donote.theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          root.setAttribute('data-theme', theme);
        } catch (e) {
          root.setAttribute('data-theme', 'dark');
        }
        try {
          // 默认展开；只有用户明确折叠过才关。移动端一律先关（那里是抽屉，不该自动弹开）
          var pref = localStorage.getItem('donote.sidebar');
          var wide = window.innerWidth >= 1024;
          root.setAttribute('data-sidebar', wide && pref !== 'closed' ? 'open' : 'closed');
        } catch (e) {
          root.setAttribute('data-sidebar', 'closed');
        }
        var cores = navigator.hardwareConcurrency || 8;
        var memory = navigator.deviceMemory || 8;
        if (cores <= 4 || memory <= 4) {
          root.setAttribute('data-lite', '1');
        }
      })();
    </script>
    <style>
      /* 首屏底色也内联，避免样式表到达前出现白闪 */
      html {
        background: #0b1020;
      }
      html[data-theme='light'] {
        background: #f8f9fc;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
