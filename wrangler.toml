# NoteApp 唯一一份 wrangler 配置（仓库根目录）
# 子包通过 --config ../../wrangler.toml 指回本文件，避免配置漂移。
# 注意：不在此文件写 account_id，账号由环境变量 CLOUDFLARE_ACCOUNT_ID 提供。

name = "noteapp-api"
main = "apps/api/src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 本地开发调试端口
[dev]
port = 8787

[vars]
ENVIRONMENT = "dev"
# dev 走 Vite 同源代理，这里仍保留本机来源，便于直连调试
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

[[d1_databases]]
binding = "DB"
database_name = "noteapp-db"
database_id = "27114cad-81b3-4d3b-8bf2-080545d49a4e"

[observability]
enabled = true

# ------------------------------ 生产环境 ------------------------------
# wrangler deploy --env production 选中本节。
# 绑定与 vars 需在本节重新声明（named env 不继承顶层 binding）。

[env.production]
name = "noteapp-api"

[env.production.vars]
ENVIRONMENT = "production"
# 前端 Pages 域名（wrangler pages project create 分配）
ALLOWED_ORIGINS = "https://noteapp-4h0.pages.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "noteapp-db"
database_id = "27114cad-81b3-4d3b-8bf2-080545d49a4e"

[env.production.observability]
enabled = true
